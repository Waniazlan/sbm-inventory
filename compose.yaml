services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sbm_inventory
      POSTGRES_USER: sbm_inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - inventory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbm_inventory -d sbm_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  inventory-postgres:
